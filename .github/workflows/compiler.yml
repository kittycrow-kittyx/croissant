name: Croissant compiler

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compiler:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Croissant
        uses: actions/checkout@v4
        with:
          path: croissant
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: croissant
        run: npm install

      - name: Type-check and compile
        working-directory: croissant
        run: npm run check && npm run build

      - name: Run compiler tests
        working-directory: croissant
        run: npm test

      - name: Check freestanding C for ARM64 and x86-64
        working-directory: croissant
        run: |
          clang --target=x86_64-unknown-none-elf -std=c11 -ffreestanding -fsyntax-only -Werror build/fixture.c
          clang --target=aarch64-none-elf -std=c11 -ffreestanding -fsyntax-only -Werror build/fixture.c

  thistle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Croissant
        uses: actions/checkout@v4
        with:
          path: croissant
          submodules: recursive

      - name: Check out Thistle
        uses: actions/checkout@v4
        with:
          repository: kittycrow-kittyx/thistle
          ref: 19b8c6c0d7b81e1526119f52fff8b5bc6f16bf6a
          path: thistle
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install compiler dependencies
        run: |
          npm install --prefix croissant/vendor/bake
          npm install --prefix croissant

      - name: Build and lower Thistle
        run: |
          npm run build --prefix croissant
          node croissant/dist/src/thistle-project.js thistle
          cd croissant/vendor/bake
          bun src/cli.ts --project ../../../thistle/tsconfig.croissant.json --out-dir build/croissant-bake --target=clang --engine=host

      - name: Emit separate native modules and headers
        run: node croissant/dist/src/cli.js --manifest thistle/build/croissant-bake/bake-manifest.json --out-dir croissant/build/rei

      - name: Compile every native module independently for x86-64 and ARM64
        shell: bash
        run: |
          set -euo pipefail
          test -s croissant/build/rei/src/native/kernel.c
          test -s croissant/build/rei/include/croissant/native/kernel.h
          test -s croissant/build/rei/croissant.manifest.json
          for target in x86_64 aarch64; do
            case "$target" in
              x86_64) triple=x86_64-unknown-none-elf ;;
              aarch64) triple=aarch64-none-elf ;;
            esac
            while IFS= read -r -d '' source; do
              relative="${source#croissant/build/rei/src/}"
              object="croissant/build/objects/$target/${relative%.c}.o"
              mkdir -p "$(dirname "$object")"
              clang --target="$triple" -std=c11 -O1 -ffreestanding \
                -fno-builtin -fno-stack-protector -Werror \
                -Icroissant/build/rei/include -c "$source" -o "$object"
            done < <(find croissant/build/rei/src -type f -name '*.c' -print0 | sort -z)
            test -s "croissant/build/objects/$target/native/kernel.o"
            file "croissant/build/objects/$target/native/kernel.o"
            nm -g "croissant/build/objects/$target/native/kernel.o" | grep tetoKernelInit
          done

